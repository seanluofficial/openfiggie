[project]
name = "openfiggie"
version = "0.1.0"
description = "An open benchmark and agent suite for Figgie, a multi-agent trading game with imperfect information."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "seanluofficial" }]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
openfiggie = "openfiggie.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openfiggie"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
